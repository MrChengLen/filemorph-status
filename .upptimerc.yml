# Status page for filemorph.io (Upptime). Public repository:
# only public URLs belong here, never server addresses or secrets.
owner: MrChengLen
repo: filemorph-status

sites:
  - name: FileMorph Website
    url: https://filemorph.io/
  - name: FileMorph API
    url: https://filemorph.io/api/v1/health

assignees:
  - MrChengLen

user-agent: MrChengLen

skipDescriptionUpdate: true

status-website:
  baseUrl: /filemorph-status
  name: FileMorph Status
  logoUrl: https://filemorph.io/static/favicon.svg
  faviconSvg: https://filemorph.io/static/favicon.svg
  favicon: https://filemorph.io/apple-touch-icon.png
  introTitle: "**FileMorph** status"
  introMessage: "Availability of [filemorph.io](https://filemorph.io), checked every 5 minutes from GitHub Actions. Outages open an issue in this repository automatically. · Verfügbarkeit von filemorph.io, alle 5 Minuten geprüft."
  navbar:
    - title: Status
      href: /
    - title: FileMorph
      href: https://filemorph.io/
    - title: Impressum
      href: https://filemorph.io/impressum
    - title: Datenschutz
      href: https://filemorph.io/privacy
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
