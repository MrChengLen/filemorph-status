# Status page for filemorph.io (Upptime). Public repository:
# only public URLs belong here, never server addresses or secrets.
owner: MrChengLen
repo: filemorph-status

# Own icons: without them the page loads site icons from a third-party
# favicon service in every visitor's browser.
sites:
  - name: FileMorph Website
    url: https://filemorph.io/
    icon: https://filemorph.io/apple-touch-icon.png
  # The readiness check also tests the database and the temp directory.
  - name: FileMorph API
    url: https://filemorph.io/api/v1/ready
    icon: https://filemorph.io/apple-touch-icon.png
  - name: Upload API
    url: https://api.filemorph.io/api/v1/ready
    icon: https://filemorph.io/apple-touch-icon.png

assignees:
  - MrChengLen

user-agent: MrChengLen

skipDescriptionUpdate: true

status-website:
  baseUrl: /filemorph-status
  name: FileMorph Status
  logoUrl: https://filemorph.io/static/favicon.svg
  faviconSvg: https://filemorph.io/static/favicon.svg
  favicon: https://filemorph.io/apple-touch-icon.png
  introTitle: "**FileMorph** status"
  introMessage: "Availability of [filemorph.io](https://filemorph.io), checked about every 5 minutes from GitHub Actions. Outages open an issue in this repository automatically. · Verfügbarkeit von filemorph.io, etwa alle 5 Minuten geprüft."
  navbar:
    - title: Status
      href: /filemorph-status/
    - title: FileMorph
      href: https://filemorph.io/
    - title: Impressum
      href: https://filemorph.io/impressum
    - title: Datenschutz
      href: https://filemorph.io/privacy#status-page
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
